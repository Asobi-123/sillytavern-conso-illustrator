name: Update tag catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 1 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-tag-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update catalog and bridge
        run: npm run catalog:update

      - name: Validate generated data
        run: |
          npm run test
          npm run build
          git diff --check

      - name: Check for generated changes
        id: diff
        run: |
          if git diff --quiet -- src/data/tag_catalog.json src/data/zh_tag_bridge.generated.json src/data/tag_bridge_report.json dist/index.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare pull request branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          branch="automation/update-tag-catalog"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/data/tag_catalog.json src/data/zh_tag_bridge.generated.json src/data/tag_bridge_report.json dist/index.js
          git commit -m "chore: update tag catalog data"
          git push --force-with-lease origin "$branch"
          echo "branch=$branch" >> "$GITHUB_ENV"

      - name: Create or update pull request
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.branch;
            const {owner, repo} = context.repo;
            const title = 'chore: update tag catalog data';
            const body = [
              'Automated tag catalog refresh.',
              '',
              'Generated files:',
              '- `src/data/tag_catalog.json`',
              '- `src/data/zh_tag_bridge.generated.json`',
              '- `src/data/tag_bridge_report.json`',
              '- `dist/index.js`',
              '',
              'Validation:',
              '- `npm run test`',
              '- `npm run build`',
              '- `git diff --check`',
              '',
              'Review `tag_bridge_report.json` before merging, especially unbridged high-frequency tags and category coverage.'
            ].join('\n');

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: 'open',
            });

            if (existing.data.length > 0) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existing.data[0].number,
                title,
                body,
              });
              return;
            }

            await github.rest.pulls.create({
              owner,
              repo,
              title,
              body,
              head: branch,
              base: 'main',
            });
